[extruder]
step_pin: EBBCan: PD0
dir_pin: EBBCan: PD1
enable_pin: !EBBCan: PD2
#rotation_distance: 5.62485#LGX Lite
rotation_distance: 47.432     #Galileo2
gear_ratio: 9:1				#Galileo2
microsteps: 64
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: EBBCan: PB13
##	Validate the following thermistor type to make sure it is correct
#sensor_type: NTC 100K beta 3950
#sensor_pin: PF4

# sensor_type: MAX31865 # Adjust for your hotend thermistor (see options below)
# sensor_pin: PA15
# spi_bus: spi3

sensor_type:MAX31865
sensor_pin: EBBCan:PA4
spi_bus: spi1

min_temp: 10
max_temp: 270
max_power: 1.0
min_extrude_temp: 170
control = pid

## TL HF Dragon
# pid_kp = 25.948
# pid_ki = 1.966
# pid_kd = 85.631

# ## TL Rapido
pid_kp = 20.231
pid_ki = 1.752
pid_kd = 58.417


## E3D V6
# pid_kp = 28.689
# pid_ki = 1.594
# pid_kd = 129.101
##	Try to keep pressure_advance below 1.0
pressure_advance: 0.026
##	Default is 0.040, leave stock
pressure_advance_smooth_time: 0.040
max_extrude_only_distance: 5000.0
max_extrude_cross_section: 5000.0

[tmc2209 extruder]
uart_pin: EBBCan: PA15
interpolate: False
run_current: 0.6
sense_resistor: 0.110

