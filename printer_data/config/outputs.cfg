[heater_bed]
heater_pin: PA1
sensor_pin: PF3
sensor_type: Generic 3950
control: pid
pid_kp: 66.153
pid_ki: 2.358
pid_kd: 463.897
min_temp: 0
max_temp: 115
pwm_cycle_time: 0.02

[fan]
pin: EBBCan: PA1
kick_start_time: 0.5
##	Depending on your fan, you may need to increase this value
##	if your fan will not start. Can change cycle_time (increase)
##	if your fan is not able to slow down effectively
off_below: 0.10

[heater_fan hotend_fan]
pin: EBBCan: PA0
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

[output_pin Lights]
pin: PA3
pwm: false

[controller_fan controller_fan]
#	Controller fan - Z board, HE1 Connector
pin: PD14
kick_start_time: 0.5
max_power: 1.0
fan_speed: 0.5
idle_timeout : 20
idle_speed: 0.2

[controller_fan controller_fan2]
#	Controller fan - Z board, HE1 Connector
pin: PD15
kick_start_time: 0.5
max_power: 1.0
fan_speed: 0.5
idle_timeout : 20
idle_speed: 0.2

[fan_generic exhaust_fan]
#	Exhaust fan - Z board, HE0 Connector
pin: PD13
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 2.0
