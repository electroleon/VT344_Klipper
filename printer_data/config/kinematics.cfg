[printer]
kinematics: corexy
max_velocity: 1000  
max_accel: 12000
max_z_velocity: 10
max_z_accel: 2000
square_corner_velocity: 6.0  

[input_shaper]
shaper_freq_x: 54.8
shaper_type_x: zv
shaper_freq_y: 38.0
shaper_type_y: mzv

[z_tilt]
z_positions:
	-50, 18
	125, 298
	300, 18
points:
	30, 5
	125, 195
	220, 5
speed: 450
horizontal_move_z: 15
retries: 5
retry_tolerance: 0.0075

[bed_mesh]
speed: 450
horizontal_move_z: 10
mesh_min: 20,20
mesh_max: 230,220
probe_count: 5,5
zero_reference_position: 125, 125
#relative_reference_index: 12

[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200
endstop_pin:  ^EBBCan:PB6
position_min: 0
position_endstop: 250
position_max: 250
homing_speed: 100   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: false
run_current: 1.3
sense_resistor: 0.110

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
full_steps_per_rotation: 200
microsteps: 64
endstop_pin: ^PG6
position_min: -2
position_endstop: 258
position_max: 258
homing_speed: 100  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: false
run_current: 1.3
sense_resistor: 0.110

[stepper_z]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
rotation_distance: 8
full_steps_per_rotation: 200
microsteps: 32
endstop_pin: PG10
position_endstop: -0.5
position_max: 240
position_min: -5
homing_speed: 10 # Leadscrews are slower than 2.4, 10 is a recommended max.
second_homing_speed: 3.0
homing_retract_dist: 3.0

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z]
uart_pin: PE4
interpolate: false
run_current: 0.6
sense_resistor: 0.110

[stepper_z1]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
rotation_distance: 8
full_steps_per_rotation: 200
microsteps: 32


##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z1]
uart_pin: PE1
interpolate: false
run_current: 0.6
sense_resistor: 0.110

[stepper_z2]
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0
rotation_distance: 8
full_steps_per_rotation: 200
microsteps: 32

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z2]
uart_pin: PD3
interpolate: false
run_current: 0.6
sense_resistor: 0.110
